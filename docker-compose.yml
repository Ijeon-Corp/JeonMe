services:
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
    depends_on: [api]

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    ports: ["8080:8080"]
    env_file: apps/api/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy

  # Proses TERPISAH dari `api` (subcommand `./api worker`, image sama) --
  # memproses task asynq dari Redis (REQ-F-405: notifikasi email pembeli).
  # Dipisah supaya lambat/gagalnya pengiriman email tidak pernah berdampak
  # ke latensi endpoint checkout/webhook PSP di service `api`.
  worker:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    command: ["worker"]
    env_file: apps/api/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # API S3-compatible
      - "9001:9001" # Console web
    environment:
      MINIO_ROOT_USER: jeonme
      MINIO_ROOT_PASSWORD: jeonme12345
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  db:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: jeonme
      POSTGRES_PASSWORD: jeonme
      POSTGRES_DB: jeonme
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Migrasi TIDAK di-auto-run lewat docker-entrypoint-initdb.d (folder migrations
    # berisi file up & down sekaligus, berisiko jika ikut dieksekusi otomatis).
    # Jalankan migrasi secara eksplisit: `make -C apps/api migrate-up`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jeonme"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

volumes:
  pgdata:
  miniodata:
