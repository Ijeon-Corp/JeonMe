services:
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
    depends_on: [api]

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    ports: ["8080:8080"]
    env_file: apps/api/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: jeonme
      POSTGRES_PASSWORD: jeonme
      POSTGRES_DB: jeonme
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Migrasi TIDAK di-auto-run lewat docker-entrypoint-initdb.d (folder migrations
    # berisi file up & down sekaligus, berisiko jika ikut dieksekusi otomatis).
    # Jalankan migrasi secara eksplisit: `make -C apps/api migrate-up`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jeonme"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

volumes:
  pgdata:
