# Konfigurasi Nginx untuk PRODUCTION (jeonme.com).
# Dipisah dari konfigurasi staging (lihat ../staging/jeonme.conf) karena
# hanya environment ini yang benar-benar memasang sertifikat Certbot --
# lihat volume `./certbot/...` di docker-compose.prod.yml.
#
# Temuan tinggi H3 (audit CI/CD): sebelumnya server block 443 tidak ada
# sama sekali di file bersama yang dipakai staging & production, padahal
# volume Certbot sudah di-mount di docker-compose.prod.yml -- artinya
# trafik produksi (termasuk checkout & webhook PSP) akan berjalan plain
# HTTP jika dipakai apa adanya. Ini melanggar REQ-NF-03 (TLS 1.2+ wajib).
#
# Setup awal (sekali saja, sebelum server block 443 di bawah bisa aktif):
#   1. Pastikan DNS jeonme.com & www.jeonme.com sudah mengarah ke VPS ini.
#   2. Nyalakan stack dengan HANYA server block port 80 di bawah aktif
#      (comment sementara seluruh server block 443), supaya Nginx bisa
#      menjawab tantangan HTTP-01 Let's Encrypt.
#   3. Jalankan sekali:
#      docker compose -f docker-compose.prod.yml run --rm --entrypoint "\
#        certbot certonly --webroot -w /var/www/certbot \
#        -d jeonme.com -d www.jeonme.com \
#        --email admin@jeonme.com --agree-tos --non-interactive" certbot
#      (tambahkan service `certbot` dari image certbot/certbot ke
#      docker-compose.prod.yml jika belum ada, mount volume yang sama
#      dengan Nginx: ./certbot/conf:/etc/letsencrypt, ./certbot/www:/var/www/certbot)
#   4. Setelah sertifikat berhasil terbit di ./certbot/conf, un-comment
#      kembali server block 443 dan reload: `docker compose exec nginx nginx -s reload`.
#   5. Jadwalkan renewal (cron di VPS, bukan di GitHub Actions):
#      0 3 * * * cd /opt/jeonme && docker compose -f docker-compose.prod.yml run --rm certbot renew --quiet && docker compose -f docker-compose.prod.yml exec nginx nginx -s reload

server {
    listen 80;
    listen [::]:80;
    server_name jeonme.com www.jeonme.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jeonme.com www.jeonme.com;

    ssl_certificate     /etc/letsencrypt/live/jeonme.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jeonme.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
