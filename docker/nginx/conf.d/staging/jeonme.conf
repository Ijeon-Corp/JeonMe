# Konfigurasi Nginx untuk STAGING (staging.jeonme.com).
# HTTP saja secara sengaja -- docker-compose.staging.yml TIDAK memasang
# Certbot (tidak ada volume ./certbot/...) dan port di-mapping ke 8081,
# bukan 80/443. Asumsi (sesuai Technical Design Document §7.1): Cloudflare
# berada di depan sebagai CDN/DNS dan yang menerminasi TLS untuk domain ini
# ("Full" atau "Flexible" mode) sebelum diteruskan ke port 8081 VPS.
#
# Kalau tim memutuskan staging juga harus TLS end-to-end tanpa bergantung
# Cloudflare, duplikasi pola di ../production/jeonme.conf: tambahkan volume
# certbot terpisah di docker-compose.staging.yml, lalu isi server block 443
# di sini dengan server_name staging.jeonme.com.
server {
    listen 80;
    listen [::]:80;
    server_name staging.jeonme.com;

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
