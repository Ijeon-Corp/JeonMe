# VPS ini adalah server SHARED yang sudah menjalankan banyak proyek lain di
# balik Apache (reverse proxy + TLS per-domain via certbot --apache di level
# sistem, bukan di dalam Docker). Karena itu stack ini SENGAJA tidak punya
# service nginx/certbot sendiri -- port 80/443 host sudah dipakai Apache
# untuk domain lain dan tidak boleh direbut. web/api di-bind HANYA ke
# 127.0.0.1 (tidak pernah expose ke publik langsung), lalu Apache di level
# sistem yang mem-proxy domain staging.jeonme.com ke port-port ini.

# Driver log default (json-file) TIDAK punya batas ukuran kalau tidak
# dikonfigurasi -- bisa memenuhi disk pelan-pelan di server yang jalan lama.
# Dipakai bersama oleh semua service lewat YAML anchor.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    # GHCR_REPO harus persis "owner/repo" GitHub, sama seperti yang dipakai
    # ci.yml lewat ${{ github.repository }} -- diset di .env, BUKAN
    # dihardcode di sini (temuan tinggi H2 di audit CI/CD: placeholder
    # "OWNER" sebelumnya tidak pernah diganti dan tidak pernah cocok dengan
    # path yang benar-benar di-push CI).
    image: ghcr.io/${GHCR_REPO}/web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    depends_on: [api]
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    logging: *default-logging

  api:
    image: ghcr.io/${GHCR_REPO}/api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8080}:8080"
    logging: *default-logging

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes: ["pgdata_staging:/var/lib/postgresql/data"]
    env_file: .env
    logging: *default-logging
    # Tanpa ini, `docker compose run --rm api migrate ...` bisa mulai sebelum
    # Postgres benar-benar siap menerima koneksi ("Started" != "ready") --
    # ketahuan dari log Deploy Production run pertama: "connection refused".
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jeonme}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging

volumes:
  pgdata_staging:
