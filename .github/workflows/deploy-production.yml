name: Deploy Production

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: >-
          Commit sha untuk rollback/redeploy manual (kosongkan untuk deploy
          commit HEAD seperti biasa). Isi dengan sha rilis sebelumnya yang
          diketahui sehat -- cek tab Actions atau `git log --oneline`.
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production   # atur "required reviewers" di Settings > Environments
    permissions:
      contents: read
      packages: read
    steps:
      # Temuan L2 (audit CI/CD): sebelumnya rollback cuma bisa manual via SSH
      # (scripts/rollback.sh). Kalau workflow_dispatch diisi image_tag, itu
      # dipakai apa adanya -- kalau kosong (trigger normal dari tag/dispatch
      # tanpa input), pakai commit HEAD seperti biasa.
      - name: Tentukan IMAGE_TAG
        id: image_tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "value=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
            echo "::notice::Rollback/redeploy manual ke tag: ${{ github.event.inputs.image_tag }}"
          else
            echo "value=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      # Bug #17 (katalog CICD-GUIDE.md): workflow ini terpicu langsung oleh
      # push tag, TANPA menunggu ci.yml (yang build & push image ke GHCR)
      # selesai -- beda dari deploy-staging.yml yang memang menunggu lewat
      # workflow_run. Kalau tag dibuat segera setelah push ke main (pola
      # rilis yang wajar), "Deploy via SSH" bisa gagal "not found" karena
      # image belum selesai di-build sama sekali -- race condition, bukan
      # masalah kredensial/koneksi. Ketahuan dari log run yang gagal
      # eksplisit (bukan cuma "stuck"), diperbaiki dengan menunggu image
      # benar-benar ada di GHCR sebelum lanjut (aman juga untuk rollback ke
      # commit lama yang image-nya sudah pasti ada -- loop langsung selesai).
      - name: Login ke GHCR (runner) untuk cek ketersediaan image
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nama repository huruf kecil (wajib untuk GHCR)
        id: repo
        run: echo "lower=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Tunggu image api & web tersedia di GHCR
        run: |
          IMAGE_TAG="${{ steps.image_tag.outputs.value }}"
          REPO="${{ steps.repo.outputs.lower }}"
          for i in $(seq 1 30); do
            if docker manifest inspect "ghcr.io/${REPO}/api:${IMAGE_TAG}" >/dev/null 2>&1 && \
               docker manifest inspect "ghcr.io/${REPO}/web:${IMAGE_TAG}" >/dev/null 2>&1; then
              echo "Image tersedia setelah percobaan ke-${i}."
              exit 0
            fi
            echo "Image belum tersedia (percobaan ${i}/30), tunggu 20 detik -- kemungkinan ci.yml masih build..."
            sleep 20
          done
          echo "::error::Image ghcr.io/${REPO}/{api,web}:${IMAGE_TAG} tidak pernah tersedia setelah 10 menit -- cek apakah commit/tag ini memang pernah lolos ci.yml (job build-images)."
          exit 1

      # ref di-checkout persis di commit/tag yang IMAGE_TAG-nya dipakai --
      # penting untuk rollback: docker-compose.prod.yml yang disinkronkan
      # harus versi yang cocok dengan rilis itu, bukan compose file terbaru
      # yang mungkin sudah punya service baru yang tidak dikenal image lama.
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.image_tag.outputs.value }}

      # Bug baru (katalog CICD-GUIDE.md #12): docker-compose.prod.yml di VPS
      # ditaruh manual sekali waktu setup awal dan TIDAK PERNAH disinkron
      # ulang -- ditemukan bareng dengan kasus staging saat menambah service
      # `minio` di Sprint 2 (lihat deploy-staging.yml untuk detail lengkap).
      - name: Sinkronkan docker-compose.prod.yml ke VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          source: "docker-compose.prod.yml"
          target: "/opt/jeonme-production/"
          strip_components: 0

      # Temuan kritis C2 (audit CI/CD): GHCR mewarisi visibility repo (default
      # private) -- tanpa login eksplisit di sisi VPS, `docker compose pull`
      # akan gagal 401/denied. Gunakan token read-only khusus VPS (scope
      # read:packages saja), bukan PAT developer pribadi.
      - name: Login GHCR di VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          script: |
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

      # Temuan kritis C1 (audit CI/CD): sebelumnya langkah ini hanya berisi
      # `echo` placeholder dan TIDAK menjalankan migrasi apa pun. Sekarang
      # memakai subcommand `migrate` bawaan image API yang baru saja di-pull
      # (image sudah membawa folder migrations yang persis cocok dengan versi
      # ini, lihat docker/api/Dockerfile) -- dijalankan lewat `compose run`
      # sekali pakai, terhubung ke network compose yang sama dengan db/redis.
      #
      # Catatan rollback: ini menjalankan `migrate up`, BUKAN `migrate down`.
      # Aman karena golang-migrate idempoten (skema yang sudah diterapkan
      # tidak diulang) -- tapi kalau rilis yang di-rollback butuh migrasi
      # turun (skema tidak backward-compatible), itu tetap perlu keputusan
      # manual, lihat catatan di scripts/rollback.sh.
      - name: Jalankan migrasi database (production)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          script: |
            set -e
            cd /opt/jeonme-production
            export IMAGE_TAG=${{ steps.image_tag.outputs.value }}
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" .env
            # Sama seperti deploy-staging.yml: Modul Settings §3 (commit
            # 4baaad3) memperkenalkan ENCRYPTION_KEY (wajib PERSIS 32 byte,
            # fail-fast di production lewat mustGetEnvInProd) -- var ini belum
            # pernah ada di .env VPS manapun sebelum commit ini. Tanpa langkah
            # ini API container akan crash-loop begitu rilis ini sampai di
            # production, persis insiden yang terjadi di staging.
            # Idempotent -- hanya digenerate SEKALI, mengganti key setelahnya
            # akan membuat payout_methods yang sudah terenkripsi tak terbaca.
            if ! grep -q '^ENCRYPTION_KEY=' .env; then
              GENERATED_KEY=$(openssl rand -hex 16)
              echo "ENCRYPTION_KEY=${GENERATED_KEY}" >> .env
              echo "::warning::ENCRYPTION_KEY tidak ditemukan di .env production -- sudah digenerate otomatis (32 byte acak) dan disimpan permanen."
            fi
            docker compose -f docker-compose.prod.yml pull api
            docker compose -f docker-compose.prod.yml run --rm api migrate up

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          script: |
            set -e
            cd /opt/jeonme-production
            export IMAGE_TAG=${{ steps.image_tag.outputs.value }}
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" .env
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            # Insiden nyata, 14 Agustus 2026: deploy staging & production
            # berbagi SATU Docker daemon (VPS shared, lihat CLAUDE.md) --
            # kalau keduanya kebetulan deploy berdekatan, `docker image
            # prune` bisa saling tabrak ("a prune operation is already
            # running"). Housekeeping ini TIDAK esensial untuk keberhasilan
            # deploy (container baru di atas SUDAH `up -d` sebelum baris
            # ini) -- `set -e` di atas dulu membuat kegagalannya
            # menggagalkan SELURUH job padahal deploy sendiri sukses.
            # `|| true` supaya prune yang gagal tidak lagi menutupi status
            # deploy yang sebenarnya berhasil.
            docker image prune -f || true

      # Temuan sedang M2 (audit CI/CD): retry berjeda, bukan satu kali
      # sleep+curl -- container butuh waktu bervariasi untuk siap tergantung
      # kondisi koneksi DB/Redis saat cold start.
      #
      # Ditemukan dari rollout pertama: health check yang cuma mengecek
      # "server merespons ok" TIDAK bisa mendeteksi deploy yang gagal diam-
      # diam di tengah jalan -- container LAMA tetap menjawab sehat,
      # menyembunyikan bahwa versi baru tidak pernah benar-benar naik.
      # Sekarang verifikasi juga field `version` di respons cocok dengan
      # commit yang baru saja di-deploy (atau tag rollback yang diminta).
      # Audit keamanan 15 Agustus 2026: /api/health publik kini hanya
      # {"status":"ok"} (tanpa version) -- version tidak boleh terekspos ke
      # internet supaya penyerang tidak bisa fingerprint versi build untuk
      # riset CVE terarah. Verifikasi version dijalankan LEWAT SSH langsung
      # di VPS, men-CURL loopback (127.0.0.1:8080) -- isInternalProbe di
      # health.go mengizinkan request loopback tanpa X-Health-Token, jadi
      # TIDAK perlu secret HEALTH_TOKEN baru di repo maupun env VPS. Jalur
      # ini tidak pernah melewati Apache/internet publik, version tetap
      # privat. API_HOST_PORT default 8080 (lihat docker-compose.prod.yml
      # "127.0.0.1:${API_HOST_PORT:-8080}:8080").
      - name: Health check (via SSH loopback di VPS)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          envs: EXPECTED_VERSION
          script: |
            set -e
            cd /opt/jeonme-production
            EXPECTED_VERSION="${{ steps.image_tag.outputs.value }}"
            # API_HOST_PORT HANYA ada di .env (dibaca docker, BUKAN
            # diekspor ke shell session SSH), jadi baca langsung dari sana.
            # VPS shared sering pakai port unik per environment (SETUP-GUIDE
            # contoh 28080) -- default 8080 hanya kalau benar-benar kosong.
            API_PORT=$(grep -E '^API_HOST_PORT=' .env 2>/dev/null | cut -d= -f2 | tr -d '[:space:]')
            API_PORT="${API_PORT:-8080}"
            echo "Health check ke loopback 127.0.0.1:${API_PORT}/api/health (harapan version: ${EXPECTED_VERSION})"
            for i in $(seq 1 12); do
              BODY=$(curl -sf "http://127.0.0.1:${API_PORT}/api/health" 2>/dev/null || true)
              if [ -n "$BODY" ]; then
                echo "$BODY"
                if echo "$BODY" | grep -q "\"version\":\"${EXPECTED_VERSION}\""; then
                  echo "Versi terverifikasi cocok: ${EXPECTED_VERSION}"
                  exit 0
                fi
                echo "::error::Health check OK tapi versi yang jalan tidak cocok dengan yang diharapkan (${EXPECTED_VERSION}) -- kemungkinan deploy gagal diam-diam dan container lama masih jalan. Body: $BODY"
                exit 1
              fi
              echo "API belum siap (percobaan ${i}/12), tunggu 5 detik..."
              sleep 5
            done
            echo "::error::API tidak merespons di 127.0.0.1:${API_PORT} setelah 60 detik -- kemungkinan port salah atau container api crash-loop. Cek: docker compose -f /opt/jeonme-production/docker-compose.prod.yml logs --tail=50 api  &&  docker compose -f /opt/jeonme-production/docker-compose.prod.yml ps"
            exit 1
