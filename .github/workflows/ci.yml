name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jeonme
          POSTGRES_PASSWORD: jeonme
          POSTGRES_DB: jeonme_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jeonme"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Sebelumnya tidak ada service Redis sama sekali di sini walau
      # health_test.go butuh koneksi Redis sungguhan -- REDIS_URL menunjuk
      # ke localhost:6379 yang tidak pernah ada yang dengarkan, jadi test
      # selalu gagal "connection refused".
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: apps/api/go.sum

      - name: Download dependencies
        working-directory: apps/api
        run: go mod download

      - name: Vet
        working-directory: apps/api
        run: go vet ./...

      # Sebelumnya linting Go cuma go vet (temuan L3 di audit CI/CD) --
      # golangci-lint jalankan errcheck/staticcheck/unused/dkk sekaligus.
      # Konfigurasi di apps/api/.golangci.yml, sudah diverifikasi bersih
      # terhadap kode saat ini sebelum diaktifkan sebagai gate blocking.
      #
      # install-mode: goinstall (bukan default "binary") -- binary rilis
      # v1.64.8 dari golangci-lint sendiri dikompilasi dengan go1.24,
      # sedangkan go.mod kita mensyaratkan go1.25.0 (naik otomatis saat
      # go get -u dependency Go bulan lalu). golangci-lint MENOLAK
      # menganalisis modul yang menargetkan versi Go lebih baru dari versi
      # Go yang dipakai mengompilasi golangci-lint itu sendiri ("the Go
      # language version ... is lower than the targeted Go version").
      # goinstall build dari source pakai toolchain Go 1.25 yang sudah
      # disiapkan actions/setup-go di atas, jadi versinya selalu cocok.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          install-mode: goinstall
          working-directory: apps/api
          args: --timeout=3m

      - name: Build binary
        working-directory: apps/api
        run: go build -o bin/api main.go

      - name: Apply migrations to test database
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://jeonme:jeonme@127.0.0.1:5432/jeonme_test?sslmode=disable
        # Memakai subcommand migrate bawaan binary (internal/migrate), bukan
        # CLI golang-migrate terpisah -- lihat temuan kritis C3 di audit CI/CD:
        # sebelumnya go test berjalan melawan skema kosong tanpa migrasi apa pun.
        run: ./bin/api migrate up

      - name: Run tests
        working-directory: apps/api
        env:
          APP_ENV: test
          DATABASE_URL: postgres://jeonme:jeonme@127.0.0.1:5432/jeonme_test?sslmode=disable
          REDIS_URL: redis://127.0.0.1:6379/0
          JWT_SECRET: ci-test-secret
        run: go test ./... -v

      # Non-blocking untuk sekarang (temuan sedang M3 di audit CI/CD) -- jadikan
      # blocking setelah tim terbiasa dengan noise-nya dan backlog awal beres.
      - name: Vulnerability scan (govulncheck)
        working-directory: apps/api
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      # Bug ditemukan (5 Agustus 2026): npm ci gagal berulang di CI dengan
      # error "missing from lock file" yang BERBEDA-BEDA tiap kali (versi
      # @emnapi/core/runtime/wasi-threads yang berbeda-beda) walau lock file
      # baru saja diregenerasi bersih & terverifikasi stabil di Windows
      # MAUPUN WSL Linux -- bahkan setelah dipaksa lewat "overrides" di
      # package.json. Diduga bug/keterbatasan npm ci sendiri saat overrides
      # bersinggungan dengan peerDependencies opsional platform wasm32 (paket
      # yang TIDAK PERNAH benar-benar terpasang di x64 manapun). docker/web/
      # Dockerfile (build image sungguhan yang di-deploy) SUDAH memakai
      # `npm install`, bukan `npm ci` -- jadi pipeline deploy sesungguhnya
      # tidak pernah kena masalah ini, cuma gerbang CI test-frontend ini.
      # npm install menghormati lock file untuk semua yang benar-benar
      # terpasang, cuma tidak sekeras npm ci soal validasi entri opsional
      # yang toh tidak pernah dipakai.
      - name: Install dependencies
        working-directory: apps/web
        run: npm install
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Type check
        working-directory: apps/web
        run: npm run typecheck
      - name: Build
        working-directory: apps/web
        run: npm run build

      # Non-blocking untuk sekarang (temuan sedang M3 di audit CI/CD).
      - name: Audit dependency vulnerabilities
        working-directory: apps/web
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  build-images:
    needs: [test-backend, test-frontend]
    # Sebelumnya jalan untuk push ke branch mana pun (termasuk develop),
    # padahal tidak ada environment yang deploy dari situ -- pemborosan
    # build + storage GHCR. Dibatasi ke main saja.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR (dan Docker image reference pada umumnya) HANYA menerima nama
      # repository huruf kecil, sedangkan ${{ github.repository }} mengembalikan
      # case asli repo (mis. "Ijeon-Corp/JeonMe") -- tanpa langkah ini, push image
      # akan gagal "invalid reference format".
      - name: Nama repository huruf kecil (wajib untuk GHCR)
        id: repo
        run: echo "lower=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Tag :latest hanya dipublikasikan dari main -- dipakai sebagai fallback
      # oleh docker-compose.staging.yml (${IMAGE_TAG:-latest}) sebelum .env di
      # VPS pernah diisi tag sungguhan oleh deploy-staging.yml. Lihat temuan
      # tinggi H1 di audit CI/CD: sebelumnya tidak ada tag fallback yang benar-
      # benar ada di registry, jadi deploy pertama kali akan gagal pull.
      - name: Tentukan tag image tambahan
        id: extra_tag
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "value=latest" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/api/Dockerfile
          push: true
          # VERSION disuntik ke binary supaya /api/health bisa mengembalikan
          # commit yang sungguhan jalan -- dipakai deploy-*.yml untuk
          # memverifikasi deploy benar-benar memutakhirkan container, bukan
          # cuma "server merespons ok" (lihat main.go & CICD-GUIDE.md §11).
          build-args: |
            VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ steps.repo.outputs.lower }}/api:${{ github.sha }}
            ${{ steps.extra_tag.outputs.value != '' && format('ghcr.io/{0}/api:{1}', steps.repo.outputs.lower, steps.extra_tag.outputs.value) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/web/Dockerfile
          push: true
          # NEXT_PUBLIC_GOOGLE_CLIENT_ID -- lihat catatan lengkap di
          # docker/web/Dockerfile: TANPA build-arg ini tombol "Lanjutkan
          # dengan Google" tidak pernah muncul di staging/production sama
          # sekali (bug ditemukan pengguna), walau lokal (npm run dev,
          # baca .env.local langsung) tidak kena. Diambil dari repository
          # VARIABLE (bukan secret) -- Client ID OAuth memang publik by
          # design, cuma Client Secret yang rahasia (lihat
          # apps/web/.env.example). ISI di Settings > Secrets and
          # variables > Actions > Variables > NEXT_PUBLIC_GOOGLE_CLIENT_ID,
          # nilai SAMA PERSIS dengan GOOGLE_CLIENT_ID di secret backend.
          build-args: |
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          tags: |
            ghcr.io/${{ steps.repo.outputs.lower }}/web:${{ github.sha }}
            ${{ steps.extra_tag.outputs.value != '' && format('ghcr.io/{0}/web:{1}', steps.repo.outputs.lower, steps.extra_tag.outputs.value) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
